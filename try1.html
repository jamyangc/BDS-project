```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loading Screen Example</title>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #fce4ec;
      overflow: hidden;
    }

    /* LOADER */
    #loader {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: linear-gradient(to bottom right, #ffd6e7, #ffeef5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner {
      width: 65px;
      height: 65px;
      border: 6px solid #ffffff;
      border-top: 6px solid #ff69b4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(255,105,180,0.3);
    }

    .loading-text {
      font-size: 1.2rem;
      color: #8b3a62;
      text-align: center;
      animation: fade 1.5s infinite;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fade {
      0%,100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    @keyframes dots {
      0% { content: ''; }
      33% { content: '.'; }
      66% { content: '..'; }
      100% { content: '...'; }
    }

    /* MAIN WEBSITE */
    #content {
      display: none;
      height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      color: #7a3055;
    }

    h1 {
      font-size: 3rem;
    }

    p {
      font-size: 1.2rem;
    }
  </style>
</head>

<body>

  <!-- LOADING SCREEN -->
  <div id="loader">
    <div class="spinner"></div>

    <div class="loading-text">
      Waking up chatbot server<span class="dots"></span><br><br>
      Please wait ☁️
    </div>
  </div>

  <!-- WEBSITE CONTENT -->
  <div id="content">
    <h1>Website Loaded 🎀</h1>
    <p>Your chatbot/server is ready now.</p>
  </div>

  <script>
    async function wakeServer() {
      try {

        // REPLACE THIS WITH YOUR RENDER BACKEND URL
        await fetch("https://your-backend-url.onrender.com");

      } catch (error) {
        console.log("Server waking...", error);
      }

      // Hide loader after backend responds
      document.getElementById("loader").style.display = "none";
      document.getElementById("content").style.display = "flex";
    }

    wakeServer();
  </script>

</body>
</html>
```
