
<style>
  :root {
    --pink-light: #fce4ec;
    --pink-mid: #f48fb1;
    --pink-dark: #ad1457;
    --happy: #a8d5a2;
    --neutral: #b0c4de;
    --stressed: #ffcc80;
    --sad: #b39ddb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .wrap { padding: 1.5rem; font-family: var(--font-sans); max-width: 520px; margin: 0 auto; }
  .title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.25rem; }
  .subtitle { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 1.5rem; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .month-label { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .nav-btn { background: none; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 4px 10px; cursor: pointer; color: var(--color-text-secondary); font-size: 13px; }
  .nav-btn:hover { background: var(--color-background-secondary); }
  .day-labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .day-label { text-align: center; font-size: 11px; color: var(--color-text-secondary); padding: 4px 0; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day-cell { aspect-ratio: 1; border-radius: 8px; border: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--color-text-secondary); cursor: pointer; position: relative; transition: transform 0.1s; background: var(--color-background-primary); }
  .day-cell:hover { transform: scale(1.08); border-color: var(--color-border-secondary); }
  .day-cell.empty { background: none; border: none; cursor: default; }
  .day-cell.empty:hover { transform: none; }
  .day-cell.today { border: 1.5px solid #f48fb1; color: var(--color-text-primary); font-weight: 500; }
  .day-cell.future { opacity: 0.35; cursor: default; }
  .day-cell.future:hover { transform: none; }
  .day-cell.has-mood { color: white; font-weight: 500; }
  .day-cell.happy { background: #a8d5a2; border-color: #7cb97a; color: #2e5c2e; }
  .day-cell.neutral { background: #b0c4de; border-color: #7fa3c6; color: #1e3a54; }
  .day-cell.stressed { background: #ffcc80; border-color: #ffa726; color: #5a3a00; }
  .day-cell.sad { background: #b39ddb; border-color: #9575cd; color: #2d1b69; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 1rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-secondary); }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 1rem; }
  .stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 8px; text-align: center; }
  .stat-num { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
  .stat-label { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .tooltip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: 6px; padding: 4px 8px; font-size: 11px; white-space: nowrap; pointer-events: none; z-index: 10; color: var(--color-text-primary); display: none; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .day-cell:hover .tooltip { display: block; }
  .clear-btn { font-size: 12px; color: var(--color-text-secondary); background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; opacity: 0.6; }
  .clear-btn:hover { opacity: 1; }
  .demo-note { font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 8px 12px; margin-top: 1rem; }
</style>

<div class="wrap">
  <h2 class="sr-only">Mood calendar tracker — see your mood history for the month</h2>
  <div style="display:flex; align-items:baseline; justify-content:space-between;">
    <div>
      <p class="title">Your mood this month</p>
      <p class="subtitle">Tap any past day to log or update your mood</p>
    </div>
    <button class="clear-btn" onclick="clearAll()">clear all</button>
  </div>

  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left" aria-hidden="true"></i> prev</button>
    <span class="month-label" id="month-label"></span>
    <button class="nav-btn" id="next-btn" onclick="changeMonth(1)">next <i class="ti ti-chevron-right" aria-hidden="true"></i></button>
  </div>

  <div class="day-labels">
    <div class="day-label">Su</div><div class="day-label">Mo</div><div class="day-label">Tu</div>
    <div class="day-label">We</div><div class="day-label">Th</div><div class="day-label">Fr</div><div class="day-label">Sa</div>
  </div>

  <div class="calendar-grid" id="cal-grid"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#a8d5a2"></div>Happy</div>
    <div class="legend-item"><div class="legend-dot" style="background:#b0c4de"></div>Neutral</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffcc80"></div>Stressed</div>
    <div class="legend-item"><div class="legend-dot" style="background:#b39ddb"></div>Sad</div>
  </div>

  <div class="stats" id="stats"></div>

  <div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:100; align-items:center; justify-content:center;">
    <div style="background:var(--color-background-primary); border-radius:var(--border-radius-lg); padding:1.25rem; width:220px; border:0.5px solid var(--color-border-secondary);">
      <p style="font-size:14px; font-weight:500; margin-bottom:12px; color:var(--color-text-primary);" id="modal-date"></p>
      <div style="display:grid; gap:8px;">
        <button onclick="setMood('happy')" style="background:#a8d5a2; border:none; border-radius:8px; padding:8px; cursor:pointer; font-size:13px; color:#2e5c2e; font-weight:500;">😊 Happy</button>
        <button onclick="setMood('neutral')" style="background:#b0c4de; border:none; border-radius:8px; padding:8px; cursor:pointer; font-size:13px; color:#1e3a54; font-weight:500;">😐 Neutral</button>
        <button onclick="setMood('stressed')" style="background:#ffcc80; border:none; border-radius:8px; padding:8px; cursor:pointer; font-size:13px; color:#5a3a00; font-weight:500;">😰 Stressed</button>
        <button onclick="setMood('sad')" style="background:#b39ddb; border:none; border-radius:8px; padding:8px; cursor:pointer; font-size:13px; color:#2d1b69; font-weight:500;">😔 Sad</button>
        <button id="clear-day-btn" onclick="setMood(null)" style="background:var(--color-background-secondary); border:0.5px solid var(--color-border-tertiary); border-radius:8px; padding:6px; cursor:pointer; font-size:12px; color:var(--color-text-secondary);">clear this day</button>
      </div>
      <button onclick="closeModal()" style="width:100%; margin-top:10px; background:none; border:0.5px solid var(--color-border-tertiary); border-radius:8px; padding:6px; cursor:pointer; font-size:12px; color:var(--color-text-secondary);">cancel</button>
    </div>
  </div>

  <div class="demo-note"><i class="ti ti-info-circle" aria-hidden="true" style="font-size:14px; vertical-align:-2px; margin-right:4px;"></i>Moods are saved in your browser — no account needed. Data stays on this device.</div>
</div>

<script>
  const STORAGE_KEY = 'moodCalendarData';
  let viewYear, viewMonth, selectedKey;
  const today = new Date();

  function getStoredMoods() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
  }
  function saveMoods(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
  function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function render() {
    const moods = getStoredMoods();
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const monthName = new Date(viewYear, viewMonth, 1).toLocaleString('default', { month: 'long', year: 'numeric' });
    document.getElementById('month-label').textContent = monthName;

    const nextBtn = document.getElementById('next-btn');
    const isCurrentMonth = viewYear === today.getFullYear() && viewMonth === today.getMonth();
    nextBtn.style.visibility = isCurrentMonth ? 'hidden' : 'visible';

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(viewYear, viewMonth, d);
      const mood = moods[key];
      const cell = document.createElement('div');
      const isToday = today.getFullYear()===viewYear && today.getMonth()===viewMonth && today.getDate()===d;
      const isFuture = new Date(viewYear, viewMonth, d) > today;
      cell.className = 'day-cell' + (isToday?' today':'') + (isFuture?' future':'') + (mood?' has-mood '+mood:'');
      cell.textContent = d;
      if (!isFuture) {
        cell.onclick = () => openModal(key, d);
        if (mood) {
          const tip = document.createElement('div');
          tip.className = 'tooltip';
          tip.textContent = mood.charAt(0).toUpperCase()+mood.slice(1);
          cell.appendChild(tip);
        }
      }
      grid.appendChild(cell);
    }
    renderStats(moods);
  }

  function renderStats(moods) {
    const counts = { happy:0, neutral:0, stressed:0, sad:0 };
    Object.values(moods).forEach(m => { if (counts[m]!==undefined) counts[m]++; });
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    const el = document.getElementById('stats');
    const labels = { happy:'Happy', neutral:'Neutral', stressed:'Stressed', sad:'Sad' };
    el.innerHTML = Object.entries(counts).map(([k,v])=>`
      <div class="stat-card">
        <div class="stat-num">${v}</div>
        <div class="stat-label">${labels[k]}</div>
      </div>`).join('');
  }

  function openModal(key, day) {
    selectedKey = key;
    const label = new Date(viewYear, viewMonth, day).toLocaleDateString('default', { month:'short', day:'numeric' });
    document.getElementById('modal-date').textContent = `How were you on ${label}?`;
    const moods = getStoredMoods();
    document.getElementById('clear-day-btn').style.display = moods[key] ? 'block' : 'none';
    const overlay = document.getElementById('modal-overlay');
    overlay.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
    selectedKey = null;
  }

  function setMood(mood) {
    if (!selectedKey) return;
    const moods = getStoredMoods();
    if (mood === null) delete moods[selectedKey];
    else moods[selectedKey] = mood;
    saveMoods(moods);
    closeModal();
    render();
  }

  function clearAll() {
    if (confirm('Clear all mood data? This cannot be undone.')) {
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  }

  function changeMonth(dir) {
    viewMonth += dir;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  }

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  viewYear = today.getFullYear();
  viewMonth = today.getMonth();
  render();
</script>
